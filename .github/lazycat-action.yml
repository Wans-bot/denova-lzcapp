version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/denova.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git   # 自建/无上游镜像：版本由本仓库 tag 决定

build:
  run_buildscript: false

images: []

stores:
  official:
    changelog_locales:
      - zh
      - en
    enabled: true
    create_if_missing: true
    continue_if_newer_version: true
    skip_if_version_exists: false
    retry:
      enabled: true
      max_attempts: 4
      initial_delay: 5s
      max_delay: 60s
      max_upload_timeout: 600s
    application:
      language: zh
      brief: "AI 小说创作工作台"
      description: "Denova 面向长篇创作：用写作 Agent 讨论灵感与设定、生成大纲与细纲、按细纲逐章成稿，并带版本管理与资料库。"
      keywords: "AI写作, 小说, 大纲, 创作, Agent"
      support_pc: true
      screenshot_pc_files:
        - ".github/screenshots/pc-1.png"
        - ".github/screenshots/pc-2.png"
        - ".github/screenshots/pc-3.png"
  private:
    enabled: false
